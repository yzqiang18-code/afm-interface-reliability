<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">AF-M interface reliability workflow</title>
<desc id="desc">Frozen PINDER cohorts; native structures are used only for labels and evaluation</desc>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif;fill:#172033}
.title{font-size:30px;font-weight:700}.subtitle{font-size:16px;fill:#5F6B7A}
.label{font-size:17px}.small{font-size:14px;fill:#5F6B7A}.value{font-size:18px;font-weight:700}
.kpi{font-size:38px;font-weight:750}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
</style>
